# Um comando sobe tudo:  docker compose up
#
# Quatro servicos, e cada um existe por um motivo:
#   postgres      — o banco (na Astecha vira Snowflake)
#   redis         — broker do Celery E cache compartilhado (o lock de escrita)
#   backend       — Django + DRF
#   celery_worker — o processo que roda parse e extracao fora da requisicao
#   frontend      — Vue + Vite
#
# O celery_worker e um processo SEPARADO de proposito: e isso que torna
# "estado na memoria do processo" um bug de verdade, e nao uma sutileza
# teorica. Se voce guardar o progresso de um job numa variavel global, o
# backend nao vai enxergar.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financials
      POSTGRES_USER: financials
      POSTGRES_PASSWORD: financials
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financials"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      FINANCIALS_STORAGE_ROOT: /app/var/uploads
      FINANCIALS_EXTRACTION_PROVIDER: naive
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - uploads:/app/var/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: ./backend
    command: celery -A config worker -l info
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      FINANCIALS_STORAGE_ROOT: /app/var/uploads
      FINANCIALS_EXTRACTION_PROVIDER: naive
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - uploads:/app/var/uploads
    depends_on:
      - backend
      - redis

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
